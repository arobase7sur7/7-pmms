# 7-PMMS permissions
#
# Normal players can use public devices without ACE permissions.
# Only staff/admin features need ACE grants.

# Allow staff to interact with any media player entities and see staff UI.
add_ace group.admin pmms.anyEntity allow

# Legacy URL permissions are kept for compatibility with old configs.
# Current public playback is guarded by server-side URL validation instead.
add_ace group.admin pmms.customUrl allow

# Allow staff to bypass URL allow-list restrictions where legacy integrations still check them.
add_ace group.admin pmms.anyUrl allow

# Allow staff/admins to fully manage all media players and use the Admin Panel
add_ace group.admin pmms.manage allow
add_ace qbcore.god pmms.manage allow
add_ace qbcore.admin pmms.manage allow

# Allow these players to clear live device sessions and use the extended admin range
add_ace group.admin pmms.overrideDevice allow
add_ace qbcore.god pmms.overrideDevice allow
add_ace qbcore.admin pmms.overrideDevice allow

# QBCore-friendly direct grants. QBCore servers often assign players to
# qbcore.god/qbcore.admin instead of only group.admin.
add_ace qbcore.god pmms.anyEntity allow
add_ace qbcore.admin pmms.anyEntity allow
add_ace qbcore.god pmms.customUrl allow
add_ace qbcore.admin pmms.customUrl allow
add_ace qbcore.god pmms.anyUrl allow
add_ace qbcore.admin pmms.anyUrl allow


## Commands

# If you modify the command prefix and separator in config.lua, you must also update the command names below!

# Open the media player control panel
add_ace builtin.everyone command.pmms allow

# Public commands. Server-side device/admin locks still apply.
add_ace builtin.everyone command.pmms_play allow
add_ace builtin.everyone command.pmms_pause allow
add_ace builtin.everyone command.pmms_stop allow
add_ace builtin.everyone command.pmms_status allow
add_ace builtin.everyone command.pmms_presets allow
add_ace builtin.everyone command.pmms_vol allow
add_ace builtin.everyone command.pmms_fix allow

# Advanced media player control
add_ace group.admin command.pmms_ctl allow

# Add or modify media player model presets
add_ace group.admin command.pmms_add allow

# Refresh permissions for all clients
add_ace group.admin command.pmms_refresh_perms allow
add_ace qbcore.god command.pmms_refresh_perms allow
add_ace qbcore.admin command.pmms_refresh_perms allow
add_ace group.admin command.pmms_perms allow
add_ace qbcore.god command.pmms_perms allow
add_ace qbcore.admin command.pmms_perms allow

# Admin diagnostics
add_ace group.admin command.pmmsperf allow
add_ace group.admin command.pmmsproviders allow
add_ace qbcore.god command.pmmsperf allow
add_ace qbcore.admin command.pmmsperf allow
add_ace qbcore.god command.pmmsproviders allow
add_ace qbcore.admin command.pmmsproviders allow
